services:
  - type: web
    name: aiops-mvp
    runtime: python
    runtimeVersion: 3.11.0
    buildCommand: pip install -r requirements_minimal.txt
    startCommand: python dashboard_lite.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "5000"
