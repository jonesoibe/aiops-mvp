<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus AIOps - Enterprise Observability{% endblock %}</title>

    <!-- Design Tokens -->
    <link rel="stylesheet" href="{{ url_for('static', filename='design-tokens.css') }}">

    <!-- Page Styles -->
    <style>
        body {
            min-height: 100vh;
            background: var(--bg-primary);
            margin: 0;
            padding: 0;
        }

        /* Dark mode specific styles */
        [data-theme="dark"] {
            color-scheme: dark;
        }

        /* Light mode specific styles */
        [data-theme="light"] {
            color-scheme: light;
        }

        /* Smooth theme transitions */
        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>

    {% block extra_styles %}{% endblock %}
</head>
<body>
    <!-- MAIN CONTENT -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Theme Manager (must load before other scripts) -->
    <script src="{{ url_for('static', filename='theme-manager.js') }}"></script>

    {% block extra_scripts %}{% endblock %}
</body>
</html>
