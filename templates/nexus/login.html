<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AIOps - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='design-tokens.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: var(--space-6);
        }

        .login-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-xl);
            padding: var(--space-8);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .login-logo {
            font-size: 2.5em;
            margin-bottom: var(--space-3);
        }

        .login-title {
            font-size: var(--fs-2xl);
            font-weight: var(--fw-bold);
            color: var(--text-primary);
            margin-bottom: var(--space-1);
        }

        .login-subtitle {
            font-size: var(--fs-sm);
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: var(--space-6);
        }

        .form-label {
            display: block;
            font-size: var(--fs-sm);
            font-weight: var(--fw-medium);
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: var(--bg-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-size: var(--fs-sm);
            box-sizing: border-box;
            transition: all var(--transition-base);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-info);
            box-shadow: 0 0 0 3px rgba(45, 212, 255, 0.1);
        }

        .login-button {
            width: 100%;
            padding: var(--space-3) var(--space-4);
            background: linear-gradient(135deg, var(--color-success), var(--color-info));
            border: none;
            border-radius: var(--radius-lg);
            color: var(--text-inverse);
            font-size: var(--fs-sm);
            font-weight: var(--fw-bold);
            cursor: pointer;
            transition: all var(--transition-base);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: var(--glow-success);
        }

        .login-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .credentials-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            padding: var(--space-4);
            margin-top: var(--space-6);
            font-size: var(--fs-xs);
            color: var(--text-secondary);
        }

        .credentials-title {
            font-weight: var(--fw-bold);
            color: var(--text-primary);
            margin-bottom: var(--space-2);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .credentials-item {
            padding: var(--space-2) 0;
            border-bottom: 1px solid var(--border-primary);
            font-family: var(--font-mono);
        }

        .credentials-item:last-child {
            border-bottom: none;
        }

        .error-message {
            display: none;
            padding: var(--space-3);
            background: rgba(255, 77, 166, 0.1);
            border: 1px solid var(--color-critical);
            border-radius: var(--radius-lg);
            color: var(--color-critical);
            font-size: var(--fs-sm);
            margin-bottom: var(--space-4);
        }

        .error-message.show {
            display: block;
        }

        .toggle-credentials {
            text-align: center;
            margin-top: var(--space-4);
        }

        .toggle-btn {
            background: none;
            border: none;
            color: var(--color-info);
            cursor: pointer;
            font-size: var(--fs-xs);
            text-decoration: underline;
            transition: all var(--transition-base);
        }

        .toggle-btn:hover {
            color: var(--color-success);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">🚀</div>
                <div class="login-title">Nexus AIOps</div>
                <div class="login-subtitle">Enterprise Autonomous Observability Platform</div>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="errorMessage"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin" required>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" class="login-button" id="submitBtn">Sign In</button>
            </form>

            <!-- Toggle Credentials -->
            <div class="toggle-credentials">
                <button class="toggle-btn" onclick="toggleCredentials()" type="button">
                    📋 Show Demo Credentials
                </button>
            </div>

            <!-- Demo Credentials Box -->
            <div class="credentials-box" id="credentialsBox" style="display: none;">
                <div class="credentials-title">🔐 Demo Accounts</div>
                <div class="credentials-item"><strong>Admin:</strong> admin / admin123</div>
                <div class="credentials-item"><strong>Operator:</strong> operator / operator123</div>
                <div class="credentials-item"><strong>Viewer:</strong> viewer / viewer123</div>
            </div>
        </div>
    </div>

    <script>
        function toggleCredentials() {
            const box = document.getElementById('credentialsBox');
            box.style.display = box.style.display === 'none' ? 'block' : 'none';
        }

        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            // Clear error
            errorMsg.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';

            // API call
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.token && data.user) {
                    // Save to localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect to dashboard
                    window.location.href = '/';
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            })
            .catch(error => {
                errorMsg.textContent = '❌ ' + (error.message || 'Invalid credentials');
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            });
        }

        // Auto-fill admin credentials on load for demo
        window.addEventListener('load', () => {
            document.getElementById('username').value = 'admin';
            document.getElementById('password').value = 'admin123';
        });
    </script>
</body>
</html>
