<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus AIOps - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='design-tokens.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-primary);
            background-image: radial-gradient(ellipse 70% 50% at 50% -10%, rgba(99, 102, 241, 0.28), transparent 70%);
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(124, 131, 255, 0.07) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(124, 131, 255, 0.07) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 100%);
            -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 100%);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: var(--space-6);
            position: relative;
            animation: reveal 560ms var(--ease-out) both;
        }

        .login-card {
            background: color-mix(in srgb, var(--bg-secondary) 86%, transparent);
            backdrop-filter: blur(18px);
            border: 1px solid var(--border-primary);
            border-radius: 24px;
            padding: var(--space-8);
            box-shadow: 0 24px 64px rgba(5, 6, 20, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--space-8);
        }

        .login-logo {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--space-4);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: linear-gradient(145deg, var(--brand), #8b5cf6);
            box-shadow: 0 10px 28px rgba(99, 102, 241, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .login-title {
            font-family: var(--font-display);
            font-size: var(--fs-4xl);
            font-weight: var(--fw-bold);
            letter-spacing: var(--ls-display);
            color: var(--text-primary);
            margin-bottom: var(--space-2);
        }

        .login-subtitle {
            font-size: var(--fs-md);
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: var(--space-5);
        }

        .form-label {
            display: block;
            font-size: 11px;
            font-weight: var(--fw-medium);
            color: var(--text-secondary);
            margin-bottom: var(--space-2);
            text-transform: uppercase;
            letter-spacing: 0.12em;
        }

        .form-input {
            width: 100%;
            padding: 12px var(--space-4);
            background: var(--bg-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font: inherit;
            font-size: var(--fs-md);
            box-sizing: border-box;
            transition: border-color 160ms var(--ease-out), box-shadow 200ms var(--ease-out);
        }

        .form-input::placeholder {
            color: var(--text-tertiary);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--brand-strong);
            box-shadow: 0 0 0 4px var(--brand-dim);
        }

        .login-button {
            width: 100%;
            padding: 13px var(--space-4);
            background: var(--brand);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            font: inherit;
            font-size: var(--fs-md);
            font-weight: var(--fw-semibold);
            cursor: pointer;
            transition: transform 160ms var(--ease-out), box-shadow 200ms var(--ease-out), background-color 200ms var(--ease-out);
        }

        .login-button:active:not(:disabled) {
            transform: scale(0.97);
        }

        @media (hover: hover) and (pointer: fine) {
            .login-button:hover:not(:disabled) {
                background: var(--brand-strong);
                box-shadow: var(--brand-glow);
            }
        }

        .login-button:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .error-message {
            display: none;
            padding: var(--space-3) var(--space-4);
            background: var(--color-critical-dim);
            border: 1px solid var(--color-critical);
            border-radius: var(--radius-md);
            color: var(--color-critical);
            font-size: var(--fs-sm);
            margin-bottom: var(--space-4);
        }

        .error-message.show {
            display: block;
            animation: reveal 240ms var(--ease-out) both;
        }

        .auth-links {
            display: flex;
            gap: var(--space-4);
            justify-content: center;
            margin-top: var(--space-6);
            padding-top: var(--space-6);
            border-top: 1px solid var(--border-secondary);
        }

        .auth-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: var(--fs-sm);
            transition: color 160ms var(--ease-out);
            font-weight: var(--fw-medium);
        }

        .auth-link:hover {
            color: var(--brand-strong);
        }

        .auth-link-separator {
            color: var(--text-tertiary);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- Header -->
            <div class="login-header">
                <div class="login-logo">⚡</div>
                <div class="login-title">Nexus AIOps</div>
                <div class="login-subtitle">Sign in to your observability workspace</div>
            </div>

            <!-- Error Message -->
            <div class="error-message" id="errorMessage"></div>

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" novalidate>
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" id="username" class="form-input" placeholder="admin">
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••">
                </div>

                <button type="submit" class="login-button" id="submitBtn">Sign In</button>
            </form>


            <!-- Authentication Links -->
            <div class="auth-links">
                <a href="/forgot-password" class="auth-link">🔐 Forgot Password</a>
                <span class="auth-link-separator">•</span>
                <a href="/signup" class="auth-link">✨ Sign Up</a>
            </div>
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');

            // Validation
            if (!username || !password) {
                errorMsg.textContent = '❌ Username and password are required';
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
                return;
            }

            // Clear error
            errorMsg.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Signing In...';

            // API call
            fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    password: password
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.token && data.user) {
                    // Save to localStorage
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.user));

                    // Redirect to dashboard
                    window.location.href = '/';
                } else {
                    throw new Error(data.error || 'Login failed');
                }
            })
            .catch(error => {
                errorMsg.textContent = '❌ ' + (error.message || 'Invalid credentials');
                errorMsg.classList.add('show');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            });
        }

    </script>
</body>
</html>
